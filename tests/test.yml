---
- hosts: localhost
  become: true
  environment:
    # for shell task in tasks/install-debian.yml
    MODULE_STRICT_UTF8_RESPONSE: "False"
  vars:
    telegraf_output_plugins:
      - name: influxdb
        options:
          urls: ["http://localhost:8086"]
          database: "telegraf-test"
          write_consistency: "any"
          timeout: "5s"
  roles:
    - ansible-role-telegraf
