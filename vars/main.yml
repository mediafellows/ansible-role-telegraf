---

# Channel of Telegraf to install
telegraf_install_version: stable

# Telegraf repo (by Influxdata)
telegraf_repo_base_url: "https://repos.influxdata.com"
telegraf_repo_apt_key_name: influxdata-archive_compat-exp2029.key
telegraf_repo_apt_tmp_key_dest: '/tmp/{{ telegraf_repo_apt_key_name }}'

telegraf_repo_apt_key_dest: /etc/apt/trusted.gpg.d/influxdata-archive_compat.gpg

# Sane defaults for global settings
telegraf_agent_interval: 10s
telegraf_round_interval: "true"
telegraf_metric_batch_size: 1000
telegraf_metric_buffer_limit: 10000
telegraf_collection_jitter: 0s
telegraf_debug: "false"
telegraf_quiet: "false"

# Location of config files
telegraf_configuration_dir: /etc/telegraf
